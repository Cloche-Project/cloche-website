name: build

# Manual only for now: the site is not published yet (no infrastructure to host it, and the Cosign key
# pair does not exist, so signing would fail). To turn it on, generate the Cosign keys (see the README,
# "Publish"), then restore the triggers below.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]
  # schedule:
  #   - cron: "00 07 * * *" # daily, after the image repos' 06:00 UTC builds, to refresh the status page

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/cloche-project/cloche-website

jobs:
  build:
    name: Build and publish site image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch image status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/fetch-status.mjs

      - name: Fetch changelog
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/fetch-changelog.mjs

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          build-args: |
            SITE_URL=${{ vars.SITE_URL }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
        run: cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${IMAGE}@${{ steps.build.outputs.digest }}"
