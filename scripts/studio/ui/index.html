<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="studio-token" content="__STUDIO_TOKEN__">
	<title>Cloche Studio</title>
	<link rel="icon" href="/favicon.svg" type="image/svg+xml">
	<script>try{var t=localStorage.getItem("studio-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
	<link rel="stylesheet" href="/style.css">
</head>
<body data-list="open" data-inspector="open">
	<header class="toolbar">
		<div class="toolbar-group">
			<button id="toggle-list" class="icon-btn" type="button" aria-expanded="true" aria-controls="list" aria-label="Show or hide the list" title="Show or hide the list (Ctrl/⌘+Alt+S)">
				<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="3" /><path d="M9.5 4.5v15" /></svg>
			</button>
			<div class="brand">
				<img src="/favicon.svg" alt="" width="24" height="24">
				<span class="wordmark">Cloche</span>
				<span class="product">Studio</span>
			</div>
			<nav id="tabs" class="tabs" aria-label="Content types"></nav>
		</div>
		<div class="toolbar-group">
			<button id="toggle-theme" class="icon-btn" type="button" aria-label="Switch between light and dark" title="Switch between light and dark">
				<svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4" /></svg>
				<svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" /></svg>
			</button>
			<button id="new" class="btn primary" type="button">New</button>
			<button id="toggle-inspector" class="icon-btn" type="button" aria-expanded="true" aria-controls="inspector" aria-label="Show or hide the properties" title="Show or hide the properties (Ctrl/⌘+Alt+I)">
				<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="3" /><path d="M14.5 4.5v15" /></svg>
			</button>
		</div>
	</header>

	<div class="workspace">
		<aside id="list" class="list" aria-label="Entries">
			<ul id="entries"></ul>
		</aside>

		<div class="editor-area">
			<div id="empty" class="empty">
				<svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" /><path d="M14 3v5h5M9 13h6M9 17h4" /></svg>
				<p>Choose an entry, or start a new one.</p>
				<button id="new-empty" class="btn primary" type="button">New</button>
			</div>

			<form id="form" autocomplete="off" hidden>
				<div class="document">
					<div class="doc-bar">
						<div class="filepath">
							<code id="path"></code>
							<span id="dirty" class="dirty" hidden>Edited</span>
						</div>
						<div class="doc-actions">
							<div class="segmented" role="group" aria-label="View">
								<button type="button" data-view="visual" aria-pressed="true">Visual</button>
								<button type="button" data-view="source" aria-pressed="false">Markdown</button>
								<button type="button" data-view="preview" aria-pressed="false">Preview</button>
							</div>
							<button id="download" class="btn" type="button" title="Download the Markdown file">Download</button>
							<button id="save" class="btn primary" type="submit">Save</button>
						</div>
					</div>
					<div class="doc-scroll">
						<div class="page">
							<div id="title-slot" class="title-slot"></div>
							<div id="visual"></div>
							<textarea id="body" class="source" spellcheck="true" aria-label="Markdown" hidden></textarea>
							<!-- No scripts run in the preview; allow-same-origin only lets the page measure its height. -->
							<iframe id="preview" title="Preview" sandbox="allow-same-origin" hidden></iframe>
						</div>
					</div>
				</div>

				<aside id="inspector" class="inspector" aria-label="Properties">
					<div class="inspector-inner">
						<h2 class="inspector-title">Properties</h2>
						<div id="langs"></div>
						<div id="fields"></div>
					</div>
				</aside>
			</form>
		</div>
	</div>

	<button id="help" class="help-btn" type="button" aria-expanded="false" aria-controls="help-pop" aria-label="About this content type" title="About this content type">
		<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M9.6 9.4a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1.1.9-1.1 1.6M12 16.8h.01" /></svg>
	</button>
	<div id="help-pop" class="popover" role="dialog" aria-label="About this content type" hidden>
		<h2 id="help-title" class="popover-title"></h2>
		<p id="help-text"></p>
		<p class="popover-path">Files: <code id="help-dir"></code></p>
	</div>

	<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
	<script type="module" src="/app.js"></script>
</body>
</html>
